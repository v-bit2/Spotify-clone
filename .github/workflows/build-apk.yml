name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect active Java version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version must be 17 or higher. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified: version $JAVA_MAJOR is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: debug.keystore could not be found or generated."
            exit 1
          fi
          echo "Temporary debug.keystore successfully verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK file not found at $EXPECTED_APK"
            echo "Searching inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file is empty (0 bytes): $EXPECTED_APK"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: File does not have .apk extension: $EXPECTED_APK"; exit 1 ;;
          esac

          echo "Verified debug APK at $EXPECTED_APK (size: $(wc -c < "$EXPECTED_APK") bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RAW_REPO="${{ github.repository }}"
          REPO_NAME=$(echo "$RAW_REPO" | sed 's|.*/||' | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi
          ASSET_DIR=$(mktemp -d -t apk-release-XXXXXX)
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to prepare APK release asset at $ASSET_PATH"
            exit 1
          fi

          echo "Prepared release asset: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset is missing or empty: $ASSET_PATH"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<'EOF'
          ### Spotific Debug APK Build #${{ github.run_number }}

          - **Build Type**: Automatically generated debug APK
          - **Built By**: GitHub Actions
          - **Workflow Run Number**: ${{ github.run_number }}
          - **Workflow Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: `${{ github.sha }}`
          - **Purpose**: Testing and verification
          - **Notice**: This APK is intended for testing and is not a Play Store production release.
          - **Signing**: Signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release published successfully!"
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"

            {
              echo "### 🚀 Debug APK Published Successfully"
              echo ""
              echo "- **Release Page**: [$RELEASE_URL]($RELEASE_URL)"
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **APK Asset**: \`$ASSET_NAME\`"
              echo ""
              echo "The debug APK can be downloaded directly on your Android device from the **Assets** section of the [GitHub Release]($RELEASE_URL)."
              echo ""
              echo "> **Backup**: The standard GitHub Actions artifact named \`app-debug-apk\` is also available on this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped."
            echo "The APK build succeeded and the GitHub Actions artifact is intact."
            echo "Artifact name: app-debug-apk"

            {
              echo "### ⚠️ Debug APK Build & Artifact Status"
              echo ""
              echo "- **APK Build**: Succeeded"
              echo "- **Actions Artifact**: \`app-debug-apk\` (available on this workflow run)"
              echo "- **GitHub Release**: Publishing did not succeed or was skipped"
              echo ""
              echo "You can download the built APK directly from the **Artifacts** section of this workflow run under the name \`app-debug-apk\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
